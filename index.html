    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: Arial, sans-serif;
        background: #0b0d12;
        color: #f5f5f5;
        line-height: 1.6;
    }

    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 8%;
        border-bottom: 1px solid #242833;
    }

    .logo {
        font-size: 23px;
        font-weight: bold;
        color: #8b9cff;
    }

    nav a {
        color: #ddd;
        text-decoration: none;
        margin-left: 22px;
        font-size: 14px;
    }

    nav a:hover {
        color: #8b9cff;
    }

    .hero {
        min-height: 78vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 80px 12%;
    }

    .tag {
        color: #a5b4fc;
        border: 1px solid #343b62;
        background: #15182a;
        padding: 7px 14px;
        border-radius: 30px;
        font-size: 13px;
        margin-bottom: 24px;
    }

    h1 {
        font-size: clamp(42px, 7vw, 76px);
        line-height: 1.1;
        margin-bottom: 20px;
        letter-spacing: -2px;
    }

    h1 span {
        color: #8b9cff;
    }

    .hero p {
        color: #a8adbb;
        max-width: 600px;
        font-size: 17px;
        margin-bottom: 30px;
    }

    .button {
        display: inline-block;
        background: #8b9cff;
        color: #0b0d12;
        padding: 13px 22px;
        border-radius: 7px;
        text-decoration: none;
        font-weight: bold;
        margin-right: 10px;
        margin-bottom: 10px;
    }

    .button.secondary {
        background: transparent;
        border: 1px solid #414654;
        color: #fff;
    }

    section {
        padding: 75px 12%;
    }

    .section-title {
        font-size: 32px;
        margin-bottom: 12px;
    }

    .section-description {
        color: #a8adbb;
        margin-bottom: 30px;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
    }

    .card {
        padding: 25px;
        background: #12151d;
        border: 1px solid #272c38;
        border-radius: 12px;
